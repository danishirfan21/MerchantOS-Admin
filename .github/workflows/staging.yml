name: Isolated HTTPS staging recovery
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SOURCE_REVISION: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: danishirfan21/MerchantOS-POS
          ref: b7efa5d3c314ea01f403e98f64565e2ff20b65d4
          path: reference-pos
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Install checksum-locked operational test dependencies
        run: bash reference-pos/deploy/operations/install-ci.sh
      - name: Create disposable operational integration database
        run: python3 reference-pos/deploy/ci_database.py
      - name: Provision real operational fixtures and verify storage, audit and alerts
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Security__AllowLoopbackHttp: true
        run: |
          for file in reference-pos/db/init/*.sql reference-pos/db/migrations/*.sql; do psql -h 127.0.0.1 -p 5433 -U merchantos -d merchantos -v ON_ERROR_STOP=1 -f "$file"; done
          dotnet build reference-pos/services/merchant-api/MerchantOS.Api.csproj -c Release
          python3 reference-pos/scripts/ci_accounts.py
          python3 reference-pos/deploy/operations/verify_operations.py
      - name: Install checksum-verified Trivy 0.76.1
        run: bash reference-pos/deploy/install-trivy.sh
      - name: Build and exercise fresh disposable HTTPS topology
        run: python3 reference-pos/deploy/verify_staging.py --directory "$RUNNER_TEMP/merchantos-staging" --admin-context .
      - name: Audit bounded operational evidence
        id: audit
        if: always()
        run: |
          python3 reference-pos/scripts/audit_artifacts.py operational-evidence operations-results.json
          if test -f operations-results.json; then python3 -c "import json,pathlib;p=pathlib.Path('operations-results.json');r=json.loads(p.read_text());r['credentialAudit']='passed';p.write_text(json.dumps(r,indent=2))"; fi
      - name: Evidence-based readiness decision
        if: success()
        run: python3 reference-pos/deploy/operations/readiness.py --operations-results operations-results.json --staging-results operational-evidence/staging-results.json --output operational-evidence/production-readiness.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.audit.outcome == 'success'
        with:
          name: isolated-staging-evidence
          path: |
            operational-evidence/
            operations-results.json
