name: Isolated HTTPS staging recovery
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: danishirfan21/MerchantOS-POS
          ref: b7392670b6f3e3f90107cd440a2462be62c0eec3
          path: reference-pos
      - name: Build and exercise fresh disposable HTTPS topology
        run: python3 reference-pos/deploy/verify_staging.py --directory "$RUNNER_TEMP/merchantos-staging" --admin-context .
      - name: Audit bounded operational evidence
        id: audit
        if: always()
        run: python3 reference-pos/scripts/audit_artifacts.py operational-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.audit.outcome == 'success'
        with:
          name: isolated-staging-evidence
          path: operational-evidence/
