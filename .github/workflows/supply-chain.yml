name: Admin container and dependency evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: danishirfan21/MerchantOS-POS
          ref: 888d0985e50c227cbf5cd5788a5fb406480d99f5
          path: reference-pos
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Restore locked JavaScript and .NET dependencies
        run: |
          npm ci
          dotnet restore src/MerchantOS.Admin/MerchantOS.Admin.csproj
      - name: Build immutable-base release containers
        run: |
          docker build -f Dockerfile -t merchantos-review-admin .
      - name: Install checksum-verified Trivy 0.76.1
        run: bash reference-pos/deploy/install-trivy.sh
      - name: Collect unsuppressed package and runtime image findings
        run: python3 reference-pos/deploy/security-review.py --project src/MerchantOS.Admin/MerchantOS.Admin.csproj --image merchantos-review-admin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: supply-chain-evidence
          path: security-evidence/
